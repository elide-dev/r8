name: Preview or promote the exact qualified R8 artifact
on:
  push:
    branches: [codex/debug-quality-qualification]
    paths: [.github/workflows/promote-debug-quality.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the reviewed exact JAR as 9.4.34-elide.1"
        type: boolean
        default: false
permissions:
  contents: read
env:
  SOURCE: 03557e2c25cb75883f2c97566a99961d16d8f9ef
  TAG: 9.4.34-elide.1
  JAR_SHA256: ffbb43a07d342a0b927ddea3b931a540db93d85c2cd5d40ebd8cc889b81226c4
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the exact successful producer build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 41917878782 --repo elide-dev/r8 --json headSha,conclusion > producer.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('producer.json'))
          assert data['headSha']==os.environ['SOURCE'] and data['conclusion']=='success'
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          repository: elide-dev/r8
          run-id: 41917878782
          artifact-ids: 13366802059
          github-token: ${{ github.token }}
          path: producer
      - name: Verify and stage the exact qualified files
        run: |
          mkdir stage
          cp producer/aot-debug-quality/r8.jar producer/aot-debug-quality/SHA256SUMS producer/aot-debug-quality/SOURCE_REVISION stage/
          test "$(cat stage/SOURCE_REVISION)" = "$SOURCE"
          (cd stage && sha256sum -c SHA256SUMS)
          echo "$JAR_SHA256  stage/r8.jar" | sha256sum -c -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-quality-release-preview
          path: stage/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: debug-quality-release-preview
          path: stage
      - name: Verify exact bytes and refuse an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$JAR_SHA256  stage/r8.jar" | sha256sum -c -
          test "$(cat stage/SOURCE_REVISION)" = "$SOURCE"
          python3 - <<'PY'
          import os,urllib.request,urllib.error
          assert os.environ['GITHUB_REPOSITORY']=='elide-dev/r8'
          for suffix in ['releases/tags/','git/ref/tags/']:
              request=urllib.request.Request('https://api.github.com/repos/elide-dev/r8/'+suffix+os.environ['TAG'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              try:
                  with urllib.request.urlopen(request):
                      raise RuntimeError('Release or tag already exists; refuse to overwrite it')
              except urllib.error.HTTPError as error:
                  if error.code!=404: raise
          PY
      - name: Publish the qualified JAR through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" stage/* --repo "$GITHUB_REPOSITORY" --draft --target "$SOURCE" \
            --title "R8 $TAG" --notes 'Retain original source filenames and optimized class-file instruction positions for Java AOT builds. The position option is opt-in. This JAR is the exact qualified artifact identified by SHA256SUMS and SOURCE_REVISION.'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify the public download used by consumers
        run: |
          mkdir public
          for file in r8.jar SHA256SUMS SOURCE_REVISION; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 300 \
              --output "public/$file" "https://github.com/elide-dev/r8/releases/download/$TAG/$file"
          done
          (cd public && sha256sum -c SHA256SUMS)
          echo "$JAR_SHA256  public/r8.jar" | sha256sum -c -
          test "$(cat public/SOURCE_REVISION)" = "$SOURCE"
